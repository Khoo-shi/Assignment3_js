<!DOCTYPE html>
<html>
<head>
  <title>Pokémon Finder</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>Pokémon Finder</h1>

<input type="text" id="pokeName" placeholder="Enter Pokémon (pikachu)">
<div id="suggestionBox" style="position: relative; z-index: 10;"></div>
<button id="searchBtn">Search</button>
<button id="randomBtn">Random Pokémon</button>

<div id="loading" class="hidden">Loading...</div>

<div id="result">
  <img id="pokeImage">
  <div id="pokeInfo"></div>
</div>

<button id="favBtn">Add to Favorites</button>

<h2>Favorites:</h2>
<div id="favorites"></div>

<script src="script.js"></script>
</body>
</html>
